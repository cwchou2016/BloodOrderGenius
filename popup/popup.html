<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>血庫小精靈</title>
    <link rel="stylesheet" type="text/css" href="popup.css"/>
  </head>
  <body>
    <div class="vertical" id="canvas">
      <div class="box horizontal">
        <a target="_blank" href="https://github.com/cwchou2016/BloodOrderGenius" id="version">version:</a>
      </div>

      <div class="box horizontal">
        <label class="switch">
          <input type="checkbox" id="isActivate" class="switchBox"/>
          <span class="slider"></span>
        </label>
        <div class="option" id="status">血庫小精靈工作中......</div>
      </div>

      <div class="box">
        <div class="title span">常用連結：</div>
            <div class="span">
                <a target="_blank" href="https://dh.blood.org.tw/hospital/">
                    <img class="site-icon" src="https://dh.blood.org.tw/hospital/images/logo-L.png">
                </a>
                <a target="_blank" href="https://www.blood.org.tw/Internet/main/index.aspx">
                    <img class="site-icon" src="https://www.blood.org.tw/Internet/main/images/Icon-72.png">
                </a>                
            </div>
      </div>

      <div class="box vertical" id="quick-phrase-box">
        <div class="title">常用片語：</div>
        <div class="vertical quick-phrase">
          <!-- <div class="horizontal span">
            <button class="del-btn">-</button>
            <div class="option">常用片語一</div>
          </div>
          <div class="horizontal span">
            <button class="del-btn">-</button>
            <div class="option">常用片語二</div>
          </div> -->

        </div>
        <hr>
        <div class="vertical span">
          <div class="horizontal span edit">
            <div>新增片語</div>
            <div class="option">
              <input type="text" id="new-phrase" size="1"/>
            </div>
            <button id="new-btn">新增</button>
          </div>
          <button id="edit-btn">編輯</button>
          <div class="edit">
            <button id="save-btn">完成</button>
          </div>
          
        </div>
      </div>

      <div class="footnote">cwchou2016</div>








    </div>
    <script src="popup.js" type="text/javascript"></script>
    <script src="../scripts/global.js" type="text/javascript"></script>
  </body>
</html>
